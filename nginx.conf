server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.html;

    location / {
        # Redirect all paths that are not files to index.html
        try_files $uri $uri/ /index.html;
    }

    error_log /var/log/nginx/error.log warn;
    access_log /var/log/nginx/access.log;
}
